<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索避けタグ -->
  <meta name="robots" content="noindex">
  <title>MOBILE SUIT ARCHIVE</title>
  
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: rgba(20, 24, 33, 0.85);
      --accent-color: #c9a050;
      --text-main: #e6e8ec;
      --text-muted: #8a92a3;
      --border-color: rgba(201, 160, 80, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* 3Dキャンバス */
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ヘッダー */
    header {
      position: absolute;
      top: 30px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
    }

    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .header-title .subtitle {
      display: block;
      font-size: 0.8rem;
      color: var(--accent-color);
      letter-spacing: 0.08em;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* 操作ガイド */
    .controls-hint {
      position: absolute;
      bottom: 30px;
      left: 40px;
      z-index: 10;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* サイドパネル（詳細画面） */
    #detail-panel {
      position: absolute;
      top: 0;
      right: -450px;
      width: 420px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--border-color);
      z-index: 20;
      padding: 40px 30px;
      overflow-y: auto;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    #detail-panel.active {
      right: 0;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .panel-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .panel-tag {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .panel-title {
      font-size: 1.4rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .panel-pilot {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .panel-quote {
      font-style: italic;
      font-size: 0.95rem;
      color: #fff;
      border-left: 2px solid var(--accent-color);
      padding-left: 12px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .panel-description {
      font-size: 0.88rem;
      line-height: 1.8;
      color: #c5cbda;
      white-space: pre-wrap;
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      header { top: 20px; left: 20px; }
      .header-title h1 { font-size: 1.3rem; }
      #detail-panel { width: 100%; right: -100%; }
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>MOBILE SUIT ARCHIVE</h1>
      <span class="subtitle">ガンダム・背景・人間群像の全記録</span>
    </div>
  </header>

  <div class="controls-hint">ドラッグ / スクロールで回転・カード選択</div>

  <div id="webgl-container"></div>

  <!-- 詳細パネル -->
  <div id="detail-panel">
    <button class="close-btn" id="close-btn">&times;</button>
    <div id="panel-content">
      <!-- JavaScriptで動的に注入 -->
    </div>
  </div>

  <script>
    // ==========================================
    // データ登録（ここを自由に書き換えて増減できるよ！）
    // ==========================================
    const archiveData = [
      {
        id: "wing-zero",
        code: "XXXG-00W0",
        name: "ウイングガンダムゼロ (EW版)",
        series: "新機動戦記ガンダムW Endless Waltz",
        pilot: "ヒイロ・ユイ",
        image: "./wing_zero.jpg", // 手元の画像パス
        quote: "「終わらない、やさしさを。」",
        description: "白い羽を持つその姿は、単なる殺戮兵器を超えた「平和への祈り」を象徴する。\n\n未来のあらゆる敗北と絶望を見せる「ゼロシステム」と対峙しながら、自らの意思で平和を選択する覚悟。ヒイロ・ユイが最後に放ったシェルターへの一撃は、戦争という時代そのものを終わらせるための決断だった。"
      },
      {
        id: "epyon",
        code: "OZ-13MS",
        name: "ガンダムエピオン",
        series: "新機動戦記ガンダムW",
        pilot: "ゼクス・マーキス / トレーズ・クシュリナーダ",
        image: "", // 画像を追加するときはここにパスを指定
        quote: "「勝利も敗北も等しく無意味だ。だが、戦う美学だけは譲れない。」",
        description: "射撃武器をいっさい持たず、ビームサーベルとヒートロッドのみで敵に立ち向かう異形の機体。\n\nトレーズ・クシュリナーダが「遠距離から引き金を引くだけの兵器はエレガントではない」という思想のもと、純粋な騎士道精神を体現させるために創り上げた。勝ち負けを超えた場所で自らの信念を貫く者だけに許された、美学の象徴。"
      }
    ];

    // ==========================================
    // Three.js 3Dステージ構築
    // ==========================================
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // カメラ
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    // レンダラー
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xc9a050, 1.5, 50);
    pointLight.position.set(0, 5, 8);
    scene.add(pointLight);

    // カードオブジェクトのグループ
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const cards = [];
    const radius = 4.5; // リングの半径
    const count = archiveData.length;

    // カード生成
    archiveData.forEach((data, index) => {
      const angle = (index / count) * Math.PI * 2;
      
      // ポスター風の板ポリゴン
      const geometry = new THREE.PlaneGeometry(2.2, 3.2);
      
      // テクスチャ読み込み（画像がない場合はフォールバック表示）
      let material;
      if (data.image) {
        const texture = new THREE.TextureLoader().load(data.image);
        material = new THREE.MeshStandardMaterial({ 
          map: texture, 
          side: THREE.DoubleSide,
          roughness: 0.3
        });
      } else {
        // 画像がない場合のダミーカードデザイン
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 768;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#141821';
        ctx.fillRect(0, 0, 512, 768);
        ctx.strokeStyle = '#c9a050';
        ctx.lineWidth = 10;
        ctx.strokeRect(20, 20, 472, 728);
        
        ctx.fillStyle = '#c9a050';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(data.code, 40, 80);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText(data.name, 40, 140);

        ctx.fillStyle = '#8a92a3';
        ctx.font = '24px sans-serif';
        ctx.fillText(data.pilot, 40, 190);

        const canvasTexture = new THREE.CanvasTexture(canvas);
        material = new THREE.MeshStandardMaterial({ 
          map: canvasTexture, 
          side: THREE.DoubleSide,
          roughness: 0.4 
        });
      }

      const card = new THREE.Mesh(geometry, material);
      
      // 配置計算
      card.position.x = Math.sin(angle) * radius;
      card.position.z = Math.cos(angle) * radius;
      card.rotation.y = angle;

      card.userData = data; // データを紐付け
      cardGroup.add(card);
      cards.push(card);
    });

    // ==========================================
    // インタラクション (ドラッグ・回転・クリック)
    // ==========================================
    let isDragging = false;
    let previousMouseX = 0;
    let targetRotation = 0;

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMouseX = e.clientX;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMouseX;
      targetRotation += deltaX * 0.005;
      previousMouseX = e.clientX;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mouseleave', () => { isDragging = false; });

    // スマホタッチ対応
    window.addEventListener('touchstart', (e) => {
      isDragging = true;
      previousMouseX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - previousMouseX;
      targetRotation += deltaX * 0.005;
      previousMouseX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    // クリック判定 (Raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      // パネルが開いているときはクリック無効
      if (document.getElementById('detail-panel').classList.contains('active')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cards);

      if (intersects.length > 0) {
        const selectedSuit = intersects[0].object.userData;
        openPanel(selectedSuit);
      }
    });

    // 詳細パネルを開く
    function openPanel(data) {
      const panelContent = document.getElementById('panel-content');
      const imgHTML = data.image ? `<img src="${data.image}" class="panel-image" alt="${data.name}">` : '';
      
      panelContent.innerHTML = `
        ${imgHTML}
        <span class="panel-tag">${data.code} / ${data.series}</span>
        <h2 class="panel-title">${data.name}</h2>
        <div class="panel-pilot">PILOT: ${data.pilot}</div>
        <div class="panel-quote">${data.quote}</div>
        <div class="panel-description">${data.description}</div>
      `;

      document.getElementById('detail-panel').classList.contains('active') ||
      document.getElementById('detail-panel').classList.add('active');
    }

    // パネルを閉じる
    document.getElementById('close-btn').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.remove('active');
    });

    // アニメーションループ
    function animate() {
      requestAnimationFrame(animate);

      // 慣性回転
      cardGroup.rotation.y += (targetRotation - cardGroup.rotation.y) * 0.08;

      renderer.render(scene, camera);
    }
    animate();

    // リサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
